          \ = []\n    try:\n        data = json.loads(memory) if isinstance(memory,\
          \ str) else (memory or {})\n        entries = data.get(\"entries\") or data.get(\"\
          hits\") or []\n        for hit in entries:\n            text = hit.get(\"\
          text\") or \"\"\n            if text.startswith(\"deed:\"):\n          \
          \      deeds.append(text.split(\":\", 1)[1].strip())\n    except Exception:\n\
          \        deeds = []\n\n    act = (action or \"\").strip()\n\n    if any(k\
          \ in act for k in [\"酒\", \"喝\", \"杯\"]):\n        deed = \"点了一杯酒\"\n  \
          \      line = \"老板擦着杯子：「来了？还是老样子。」\"\n    elif any(k in act for k in [\"\
          打\", \"砸\", \"掀\", \"闹\"]):\n        deed = \"在店里闹事\"\n        line = \"\
          老板眯起眼：「又来？上次的账还没结。」\"\n    elif any(k in act for k in [\"钱\", \"赔\", \"\
          还\"]):\n        deed = \"提到赔钱\"\n        line = \"老板哼了一声：「算你还有点良心。」\"\n\
          \    elif any(k in act for k in [\"走\", \"再见\", \"离开\"]):\n        deed\
          \ = \"准备离开\"\n        line = \"老板头也不抬：「下次记得带钱。」\"\n    else:\n        deed\
          \ = \"说了一句「\" + act[:40] + \"」\"\n        line = \"老板抬眼看了看你，没接话。\"\n\n \
          \   history_hint = \"\"\n    if any(\"闹事\" in d for d in deeds) and \"闹事\"\
          \ not in deed:\n        history_hint = \"（老板显然还记得你上次闹的事。）\"\n    elif deeds:\n\
          \        history_hint = \"（老板记得你之前\" + deeds[-1] + \"。）\"\n\n    tavern_state\
          \ = \"打烊中\" if (\"走\" in act or \"离开\" in act) else \"营业中\"\n\n    return\
          \ {\n        \"reply\": line + history_hint,\n        \"deed\": deed,\n\
          \        \"memory_count\": len(deeds),\n        \"state\": tavern_state,\n\
          \    }"
